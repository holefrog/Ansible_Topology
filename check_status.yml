---
# Ansible_Topology 状态检查
# 运行方式：ansible-playbook check_status.yml -e @secrets.yml

- name: 检查 QNAP 容器与目录状态
  hosts: qnap
  gather_facts: false
  vars:
    topology_docker_bin: /share/CACHEDEV1_DATA/.qpkg/container-station/bin/docker
    homepage_config_dir: /share/Container/homepage/config
    kuma_data_dir: /share/Container/uptime-kuma/data
  tasks:
    - name: 获取 Homepage 与 Uptime Kuma 容器状态
      ansible.builtin.command:
        cmd: >-
          {{ topology_docker_bin }} ps -a
          --filter "name=homepage"
          --filter "name=uptime-kuma"
          --format "table {{ '{{' }} .Names {{ '}}' }}\t{{ '{{' }} .Status {{ '}}' }}\t{{ '{{' }} .Ports {{ '}}' }}"
      register: topology_containers
      changed_when: false

    - name: 检查 QNAP 数据目录状态
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ homepage_config_dir }}"
        - "{{ kuma_data_dir }}"
      register: topology_dirs

    - name: 显示 QNAP 容器运行状态
      ansible.builtin.debug:
        msg: "{{ topology_containers.stdout_lines }}"

    - name: 显示 QNAP 数据目录状态
      ansible.builtin.debug:
        msg: >-
          {{ item.stat.path }}:
          {{ '存在' if item.stat.exists else '不存在' }}
      loop: "{{ topology_dirs.results }}"

- name: 检查服务网络连通性与本地拓扑文件（本机）
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: 探测 Homepage HTTP 服务 (3000)
      ansible.builtin.uri:
        url: http://192.168.50.210:3000
        timeout: 3
        status_code: [200, 301, 302]
      register: homepage_http
      failed_when: false

    - name: 探测 Uptime Kuma HTTP 服务 (3001)
      ansible.builtin.uri:
        url: http://192.168.50.210:3001
        timeout: 3
        status_code: [200, 301, 302]
      register: kuma_http
      failed_when: false

    - name: 检查本地拓扑文件
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/output/topology.md"
      register: topology_file_stat

    - name: 汇总服务状态报告
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "📊 Ansible_Topology 服务状态检查汇总"
          - "----------------------------------------------------------"
          - "🏠 Homepage    : http://192.168.50.210:3000 -> {{ '✅ 正常可访问 (HTTP ' ~ homepage_http.status ~ ')' if (homepage_http.status | default(0)) in [200, 301, 302] else '❌ 不可达' }}"
          - "📈 Uptime Kuma : http://192.168.50.210:3001 -> {{ '✅ 正常可访问 (HTTP ' ~ kuma_http.status ~ ')' if (kuma_http.status | default(0)) in [200, 301, 302] else '❌ 不可达' }}"
          - "🗺️  拓扑输出文件: output/topology.md -> {{ '✅ 已生成 (' ~ topology_file_stat.stat.size ~ ' 字节)' if topology_file_stat.stat.exists else '❌ 未生成' }}"
          - "=========================================================="
