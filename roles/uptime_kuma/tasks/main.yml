---
- name: 创建 Uptime Kuma 数据目录
  ansible.builtin.file:
    path: "{{ kuma_data_dir }}"
    state: directory
    mode: "0755"

- name: 部署 Uptime Kuma 容器
  community.docker.docker_container:
    name: uptime-kuma
    image: "{{ kuma_image }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ kuma_port }}:3001"
    volumes:
      - "{{ kuma_data_dir }}:/app/data"
