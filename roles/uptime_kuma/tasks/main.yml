---
- name: 创建 Uptime Kuma 数据目录
  ansible.builtin.file:
    path: "{{ kuma_data_dir }}"
    state: directory
    mode: "0755"

- name: 部署 Uptime Kuma 容器
  community.docker.docker_container:
    name: uptime-kuma
    image: "{{ kuma_image }}"
    state: started
    restart_policy: unless-stopped
    memory: "{{ kuma_memory_limit }}"
    cpus: "{{ kuma_cpus_limit }}"
    network_mode: host
    ports: []
    volumes:
      - "{{ kuma_data_dir }}:/app/data"

- name: 创建 Kuma 监控项（调 API，幂等）
  ansible.builtin.import_tasks: monitors.yml
  tags: kuma-monitors
