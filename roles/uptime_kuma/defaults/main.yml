---
# Uptime Kuma 默认变量（可在 host_vars/group_vars 覆盖）
kuma_image: louislam/uptime-kuma:2
kuma_port: 3001
kuma_data_dir: /share/Container/uptime-kuma/data
kuma_memory_limit: 512M
kuma_cpus_limit: 0.5

# Kuma API 地址（脚本在本机跑，直连 QNAP 上的 Kuma）
kuma_api_url: "http://{{ ansible_host }}:{{ kuma_port }}"

# Kuma 管理员账号：在 secrets.yml 里填（首次打开 :3001 网页时创建的那个账号）
# kuma_admin_user: admin
# kuma_admin_password: "xxxx"

# 监控检查间隔（秒）与重试次数：失败 N 次后才报警，避免偶发抖动误报
kuma_monitor_interval: 60
kuma_monitor_maxretries: 3

# 监控清单：名字是唯一键，重跑 playbook 时已存在的按名字跳过，不会重复建；
# 指定 group 字段会自动在 Kuma 中创建折叠分组，并将监控项移入该组。
kuma_monitors:
  # ── 网络与服务器 ──
  - name: 路由器
    type: ping
    hostname: 192.168.50.1
    group: 网络与服务器
  - name: QNAP
    type: ping
    hostname: 192.168.50.210
    group: 网络与服务器
  - name: HA 主机
    type: ping
    hostname: 192.168.50.236
    group: 网络与服务器
  - name: Home Assistant
    type: http
    url: http://192.168.50.236:8123
    group: 网络与服务器
  - name: LMS
    type: http
    url: http://192.168.50.210:9000
    group: 网络与服务器
  - name: MariaDB
    type: port
    hostname: 192.168.50.210
    port: 3306
    group: 网络与服务器

  # ── IoT 设备（7x24 在线，常驻保鲜防休眠假死）──
  - name: Lumi-Gateway-Floor-1
    type: ping
    hostname: 192.168.50.101
    group: IoT 设备
  - name: Lumi-Gateway-Floor-2
    type: ping
    hostname: 192.168.50.201
    group: IoT 设备
  - name: HoneyWell
    type: ping
    hostname: 192.168.50.193
    group: IoT 设备
  - name: bedside-lamp
    type: ping
    hostname: 192.168.50.246
    group: IoT 设备
  - name: garage-opener
    type: ping
    hostname: 192.168.50.221
    group: IoT 设备
  - name: backlit-frame
    type: ping
    hostname: 192.168.50.187
    group: IoT 设备

  # ── 安防监控 ──
  - name: Camera_Mi_F1
    type: ping
    hostname: 192.168.50.143
    group: 安防监控
  - name: Camera-Lumi-Garage
    type: ping
    hostname: 192.168.50.213
    group: 安防监控
  - name: Camera-Lumi-Backyard
    type: ping
    hostname: 192.168.50.52
    group: 安防监控
  - name: ReoLink-DoorBell
    type: ping
    hostname: 192.168.50.86
    group: 安防监控
  - name: stair-closet-camera
    type: ping
    hostname: 192.168.50.109
    group: 安防监控

  # ── 媒体设备 ──
  - name: Xiaoai-X08A
    type: ping
    hostname: 192.168.50.180
    group: 媒体设备
  - name: ESP32-Livingroom
    type: ping
    hostname: 192.168.50.114
    group: 媒体设备
  - name: ESP32-Bathroom
    type: ping
    hostname: 192.168.50.192
    group: 媒体设备
