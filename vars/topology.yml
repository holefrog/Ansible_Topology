# vars/topology.yml — 唯一的设备清单（真相源）
# IP/MAC 来源：路由器 DHCP 租约、Manually Assigned IP 清单及在线设备表。
# 未确认的字段保留 null 并标注待确认；手机使用随机 MAC，故不记录其 MAC。
# group 仅使用：网络基础设施 / 服务器 / 媒体 / 终端 / IoT / 安防 / 云端
# 本文件由 roles/uptime_kuma 与
# roles/topology/templates/topology.mmd.j2 读取渲染，手改输出文件无效。

devices:
  # ── 网络基础设施 ──
  - name: ASUS TUF Gaming BE6500
    group: 网络基础设施
    conn_type: 有线
    addr_type: 网关
    ip: 192.168.50.1
    mac: cc:28:aa:5f:a0:3c  # LAN bridge br0；由路由器接口信息确认
    note: 网关、DHCP；LAN 有线/桥接 MAC；Wi-Fi 接口另有 MAC；SSH 管理端口 22122

  # ── 服务器 ──
  - name: QNAP TS-453Bmini
    group: 服务器
    conn_type: 有线
    addr_type: 静态
    ip: 192.168.50.210
    mac: 24:5e:be:4f:75:b1
    note: 有线连接；NAS 与 Container Station 宿主机
    children:
      - name: LMS
        kind: container
        conn_type: 有线
        addr_type: 容器
        service: Lyrion
        port: 9000
        note: 为四台 ESP32 播放器提供服务
      - name: MariaDB
        kind: container
        conn_type: 有线
        addr_type: 容器
        port: 3306
        note: Kodi 共享视频库（片库及观看进度）
      - name: Home Assistant
        kind: vm
        conn_type: 有线
        addr_type: 静态
        ip: 192.168.50.236
        mac: 52:54:00:5f:c7:6f
        port: 8123
        note: Virtualization Station，bridge 模式
      - name: Uptime Kuma
        kind: container
        conn_type: 有线
        addr_type: 容器
        port: 3001
        note: 可用性监控+报警

  - name: TS-110
